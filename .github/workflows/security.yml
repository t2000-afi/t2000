name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# SPEC 37 v0.7a Phase 0 deliverable 7 (2026-05-15): cancel stale security
# scans on the same PR when a new commit lands. Main pushes / weekly
# cron get their own per-ref groups and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SPEC 30 follow-up (2026-05-14): the audit step is now a real gate
      # at `--audit-level=critical` — fails the build on any critical
      # CVE in production deps. Lower-severity findings (high/moderate/
      # low) are still printed in the CI log via `--audit-level=low` for
      # visibility but do NOT fail the build, since the current baseline
      # is 19 high-sev findings — all transitive through @naviprotocol/
      # lending and @pythnetwork/pyth-sui-js (both upstream-owned, no
      # local fix path). Tightening to `--audit-level=high` requires
      # dropping @naviprotocol/lending — a separate cleanup. Until
      # then, this is the surgical move: keep the gate REAL on critical
      # while keeping CI green on the inherited backlog.
      - name: List known vulnerabilities (informational)
        run: pnpm audit --prod --audit-level=low || true
      - name: Fail on CRITICAL vulnerabilities (real gate)
        # The npm audit endpoint intermittently returns a gzip body with no
        # content-type; pnpm doesn't decompress it and crashes parsing JSON
        # (registry-side — broke audric main 2026-07-26, reproduced on pnpm
        # 10.6.2 AND 10.15.1 with a minimal payload). Retry, then distinguish
        # the two failure modes: the parse-crash signature → loud warning,
        # gate skipped for THIS run only; anything else (a real critical
        # CVE) → fail exactly as before. The grep matches only the crash
        # text, never audit findings.
        run: |
          for attempt in 1 2 3; do
            set +e
            out=$(pnpm audit --prod --audit-level=critical 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if ! echo "$out" | grep -q "is not valid JSON"; then
              exit "$code"
            fi
            echo "::warning::npm audit endpoint returned a malformed response (attempt $attempt/3)"
            sleep 20
          done
          echo "::warning::npm audit endpoint unavailable — the critical-CVE gate could not run this build (registry outage, NOT a security finding). Re-run the workflow once the registry recovers."
      - name: License compliance
        run: npx license-checker --production --failOn 'GPL-3.0;AGPL-3.0' || true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
